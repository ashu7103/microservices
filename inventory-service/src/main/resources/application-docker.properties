spring.application.name=inventory-service
server.port=0
spring.output.ansi.enabled=ALWAYS

# --- Database (Postgres in docker or local) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/inventory_service
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- Eureka ---
# For local run: localhost
# For docker run: discovery-server
eureka.client.service-url.defaultZone=http://eureka:password@discovery-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# --- Zipkin tracing ---
# Local: http://localhost:9411
# Docker: http://zipkin:9411
spring.zipkin.base-url=http://zipkin:9411

# --- Config server discovery ---
spring.cloud.config.discovery.service-id=config
spring.cloud.config.discovery.enabled=true
