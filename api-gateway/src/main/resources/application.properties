# Discovery Server (Eureka) via Gateway
spring.cloud.gateway.routes[2].id=discovery-server
spring.cloud.gateway.routes[2].uri=http://localhost:8761

# Match dashboard and static files
spring.cloud.gateway.routes[2].predicates[0]=Path=/eureka/web,/eureka/**

# Redirect /eureka → /
spring.cloud.gateway.routes[2].filters[0]=SetPath=/
# Rewrite /eureka/** → /** (for static assets like /css/**, /eureka/apps/**)
spring.cloud.gateway.routes[2].filters[1]=RewritePath=/eureka/(?<segment>.*), /${segment}

# Basic auth (Base64 for eureka:password)
spring.cloud.gateway.routes[2].filters[2]=AddRequestHeader=Authorization,Basic ZXVyZWthOnBhc3N3b3Jk


