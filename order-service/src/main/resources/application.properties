spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/order-service
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

#order-service
spring.output.ansi.enabled=ALWAYS
server.port=8081
spring.application.name=order-service

# Eureka / Discovery setting
eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka

#Resilance4J
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
#feign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
# after 5 continous fail - i will be going to set to open
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=10s
# in open state it will wait for 10 s to change to half open
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true

# timout wait for response
resilience4j.timelimiter.instances.inventory1.timeout-duration=3s

resilience4j.retry.instances.inventory1.max-attempts=3
resilience4j.retry.instances.inventory1.wait-duration=5s

# Zipkin tracing
management.tracing.sampling.probability=1.0
spring.zipkin.base-url=http://localhost:9411/api/v2/spans
spring.zipkin.sender.type=web
management.metrics.distribution.percentiles-histogram.http.server.requests=true