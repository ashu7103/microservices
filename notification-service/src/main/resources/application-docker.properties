spring.application.name=notification-service
server.port=0

# Eureka (docker)
eureka.client.service-url.defaultZone=http://eureka:password@discovery-server:8761/eureka
eureka.instance.hostname=notification-service

# Kafka (docker)
spring.kafka.bootstrap-servers=broker:29092

# Zipkin (docker)
spring.zipkin.base-url=http://zipkin:9411
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# Kafka Consumer
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id=notificationId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.programming.techie.OrderPlacedEvent
